name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm run check
      - run: npm run test:ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_SPEC_KB_NPM_TOKEN }}